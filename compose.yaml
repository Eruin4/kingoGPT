services:
  kingogpt-api:
    build: .
    container_name: kingogpt-api
    restart: unless-stopped
    env_file:
      - state/openai-server.env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./state:/app/state
    shm_size: "1gb"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
